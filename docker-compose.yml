services:
  postgres:
    image: postgres:17-alpine
    container_name: playverse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: playverse
      POSTGRES_USER: playverse
      POSTGRES_PASSWORD: playverse_local_dev
    ports:
      - "5432:5432"
    volumes:
      - playverse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playverse -d playverse"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  playverse_pgdata:
